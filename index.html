<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unbox Your Desire | Ratnagiri Food &amp; Online Delivery</title>
    <meta
      name="description"
      content="Unbox Your Desire (UnboxRTN) is Ratnagiri's local food and online delivery platform. Order from local restaurants with no minimum cart value and 24/7 support."
    />
    <meta
      name="keywords"
      content="Unbox, UnboxRTN, Unbox Your Desire, Ratnagiri food delivery, online delivery Ratnagiri, Agashe Empire Nachane, Aaryak Solutions"
    />
    <meta name="author" content="Aaryak Solutions Pvt. Ltd." />
    <meta name="theme-color" content="#EA580C" />

    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <link rel="apple-touch-icon" href="/images/favicon.png" />

    <!-- OpenGraph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Unbox Your Desire" />
    <meta property="og:title" content="Unbox Your Desire | Ratnagiri Food &amp; Online Delivery" />
    <meta
      property="og:description"
      content="Your favourite food and desired items, delivered right to your doorstep in Ratnagiri. No minimum cart value, live tracking, and 24/7 customer support."
    />
    <meta property="og:image" content="/images/unbox-food-delivery.png" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Unbox Your Desire | Ratnagiri Food &amp; Online Delivery" />
    <meta
      name="twitter:description"
      content="Your favourite food and desired items, delivered right to your doorstep in Ratnagiri. Order online with UnboxRTN."
    />
    <meta name="twitter:image" content="/images/unbox-food-delivery.png" />

    <!-- Fonts: Plus Jakarta Sans (Display) + Manrope (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Unbox Your Desire (UnboxRTN)",
        "description": "Pioneering local food and online delivery application in Ratnagiri, Maharashtra, India.",
        "url": "https://unboxrtn.com/",
        "telephone": "+91-8767461499",
        "email": "unboxrtn@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Agashe Empire, Nachane",
          "addressLocality": "Ratnagiri",
          "addressRegion": "Maharashtra",
          "postalCode": "415612",
          "addressCountry": "IN"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
            "opens": "09:00",
            "closes": "21:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Sunday",
            "opens": "10:00",
            "closes": "20:00"
          }
        ],
        "sameAs": [
          "https://play.google.com/store/apps/details?id=com.aaryaksolutions.unbox",
          "https://apps.apple.com/in/app/unboxrtn-food-delivery/id1559733578",
          "https://www.facebook.com/unboxratnagiri",
          "https://www.instagram.com/unboxratnagiri",
          "https://twitter.com/URatnagiri"
        ]
      }
    </script>
  </head>
  <body class="bg-white text-slate-900 antialiased selection:bg-orange-100 selection:text-orange-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
